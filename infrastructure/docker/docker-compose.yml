name: accounting

services:
  postgres:
    image: postgres:16-alpine
    container_name: accounting-postgres
    restart: unless-stopped
    # Parallel query workers and hash aggregates use dynamic shared memory; Docker's
    # 64 MB default runs out under ~20 concurrent report queries ("could not resize
    # shared memory segment ... No space left on device" -> 500s). See docs/performance.md.
    shm_size: 256m
    # pg_stat_statements feeds the operations console (Administration -> Operations
    # -> Statements); the extension itself is created by postgres/init/02-extensions.sql.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=5000
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting
      POSTGRES_DB: accounting
    ports:
      # Host 5433 to avoid clashing with a locally installed PostgreSQL on 5432.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accounting -d accounting']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: accounting-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Application containers (profile "app") -----------------------------
  # `docker compose --profile app up` runs the full stack in containers.
  # Migrate-on-deploy: the same API image runs the bundled migrations once and
  # exits; the API starts only after it succeeded. The API process itself never
  # migrates, so a schema change stays an explicit, logged deployment step and a
  # failed migration stops the rollout instead of booting a broken API.
  migrate:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: accounting-migrate
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://accounting:accounting@postgres:5432/accounting
    command: ['node', 'dist/database/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: accounting-api
    env_file: ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://accounting:accounting@postgres:5432/accounting
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: accounting-web
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
